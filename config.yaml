# סיכום מידע יומי — קובץ הגדרות
# נוצר מהטופס setup.html. אפשר לערוך ידנית בכל רגע.

language: he
timezone: Asia/Jerusalem

llm:
  provider: gemini
  model: "gemini-flash-lite-latest"

defaults:
  lookback_hours: 24
  max_items_per_source: 2
  summary_bullets: 5

schedule:
  times_per_day: 2
  run_at: ["10:00", "19:00"]

topics:
  - name: "כלכלה"
    emoji: "💰"
    enabled: true
    focus: "מספרים, רמות מחיר, תחזיות והמלצות"
    targets:
      - type: telegram
        chat_id_env: TELEGRAM_CHAT_ID_ECONOMY
    sources:
      - type: youtube_channel
        name: "CryptoJungle"
        url: "https://www.youtube.com/channel/UCOCtavh3cnxvjv1XZCvBGdg"
        enabled: true
      - type: youtube_channel
        name: "Micha.Stocks"
        url: "https://www.youtube.com/channel/UCSxjNbPriyBh9RNl_QNSAtw"
        enabled: true
      - type: twitter
        name: "EliZ"
        url: "https://x.com/eliz883"
        enabled: true
      - type: youtube_channel
        name: "רז איטח"
        url: "https://www.youtube.com/@RazIttah"
        enabled: true
