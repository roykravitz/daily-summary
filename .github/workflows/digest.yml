name: סיכום מידע יומי

on:
  # התזמון האוטומטי כבוי: יוטיוב חוסם תמלולים מכתובות של ספקי ענן, ולכן
  # ריצה בענן מסכמת את תיאור הסרטון במקום את מה שנאמר בו — התזמון רץ מקומית.
  # להחזרה (למשל אחרי הוספת פרוקסי residential): python scripts/gen_workflow.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ריצת יבש — להדפיס בלוג בלי לשלוח"
        type: boolean
        default: false
      force:
        description: "להתעלם מחלון הטריות ומהיסטוריית השליחה"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # שחזור זיכרון הריצות הקודמות כדי לא לשלוח את אותו תוכן פעמיים
      - name: שחזור state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: digest-state-${{ github.run_id }}
          restore-keys: digest-state-

      # לכל נושא יש משתנה סביבה משלו (TELEGRAM_CHAT_ID_ECONOMY וכו'), ושמות
      # הנושאים משתנים. לכן כל תוכן ה-.env נשמר בסוד יחיד בשם ENV_FILE,
      # ומספיק לעדכן אותו כשמוסיפים נושא.
      - name: כתיבת .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::חסר הסוד ENV_FILE. הדבק לתוכו את כל תוכן קובץ ה-.env."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      # מי שמעדיף לשמור את רשימת המקורות פרטית יכול לשים את תוכן
      # config.yaml בסוד בשם CONFIG_YAML, ולהוסיף אותו חזרה ל-.gitignore.
      # הבדיקה נעשית בתוך הסקריפט ולא ב-if, כי GitHub לא מתיר
      # שימוש בהקשר secrets בתנאי if של שלב.
      - name: הגדרות פרטיות
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            printf '%s\n' "$CONFIG_YAML" > config.yaml
            echo "נטענו הגדרות מהסוד CONFIG_YAML"
          fi

      - name: הרצה
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m src.main \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: מחיקת .env
        if: always()
        run: rm -f .env

      # ריצת יבש לא כותבת state.json, ואז שמירת המטמון נכשלת ברעש מיותר
      - name: שמירת state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: digest-state-${{ github.run_id }}
