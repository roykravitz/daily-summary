name: סיכום מידע יומי

# שעות ה-cron הן ב-UTC, וישראל היא UTC+2 בחורף ו-UTC+3 בקיץ.
# השורות למטה נוצרו מ-config.yaml ומכוונות ל-10:00 ו-19:00 שעון ישראל.
# אחרי שינוי שעות או מעבר שעון:  python scripts/gen_workflow.py
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ריצת יבש — להדפיס בלוג בלי לשלוח"
        type: boolean
        default: false
      force:
        description: "להתעלם מחלון הטריות ומהיסטוריית השליחה"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # שחזור זיכרון הריצות הקודמות כדי לא לשלוח את אותו תוכן פעמיים
      - name: שחזור state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: digest-state-${{ github.run_id }}
          restore-keys: digest-state-

      # לכל נושא יש משתנה סביבה משלו (TELEGRAM_CHAT_ID_ECONOMY וכו'), ושמות
      # הנושאים משתנים. לכן כל תוכן ה-.env נשמר בסוד יחיד בשם ENV_FILE,
      # ומספיק לעדכן אותו כשמוסיפים נושא.
      - name: כתיבת .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::חסר הסוד ENV_FILE. הדבק לתוכו את כל תוכן קובץ ה-.env."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      # מי שמעדיף לשמור את רשימת המקורות פרטית יכול לשים את תוכן
      # config.yaml בסוד בשם CONFIG_YAML, ולהוסיף אותו חזרה ל-.gitignore.
      - name: הגדרות פרטיות
        if: ${{ secrets.CONFIG_YAML != '' }}
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          printf '%s\n' "$CONFIG_YAML" > config.yaml

      - name: הרצה
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m src.main \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: מחיקת .env
        if: always()
        run: rm -f .env

      - name: שמירת state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: digest-state-${{ github.run_id }}
